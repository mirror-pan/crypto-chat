[package]
name = "chat-desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "chat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Cryptography — reused verbatim from Phase 2 (chat-cli).
# ECDH over secp256k1 derives a shared key, AES-256-GCM encrypts the message.
secp256k1 = { version = "0.28", features = ["global-context"] }
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
hex = "0.4"

# Ethereum interaction — relays the ciphertext to Chat.sol event log.
# rustls avoids pulling in OpenSSL system bindings.
ethers = { version = "2.0", features = ["rustls"] }
tokio = { version = "1", features = ["full"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
